name: Release Desktop Tray App (macOS & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tray:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            goos: darwin
            goarch: arm64
            target: aarch64-apple-darwin
            ext: ""
          - platform: macos-13
            goos: darwin
            goarch: amd64
            target: x86_64-apple-darwin
            ext: ""
          - platform: windows-latest
            goos: windows
            goarch: amd64
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build sync-agent sidecar
        shell: bash
        run: |
          mkdir -p tray-app/src-tauri/binaries
          cd sync-agent
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o "../tray-app/src-tauri/binaries/sync-agent-${{ matrix.target }}${{ matrix.ext }}" .

      - name: Install Tauri CLI
        working-directory: tray-app
        run: npm install

      - name: Build Tauri Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tray-app
          tagName: ${{ github.ref_name }}
          releaseName: "Super-Agent ${{ github.ref_name }}"
          releaseBody: "macOS (.dmg) and Windows (.exe / .msi) installers for Super-Agent Menu Bar / System Tray companion."
          releaseDraft: true
          args: "--target ${{ matrix.target }}"
