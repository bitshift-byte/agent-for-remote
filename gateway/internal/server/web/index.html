<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super-Agent 云端工作区</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-border: #233052;
      --text: #e6ecf8;
      --muted: #93a3c7;
      --accent: #4f7cff;
      --accent-hover: #3d68e6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .hidden { display: none !important; }

    /* Centered card layout for login & dashboard */
    .center-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #182342 0%, #0b1020 65%);
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .brand h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .subtitle {
      margin: 0 0 24px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: #0d1326;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      padding: 11px 16px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary {
      background: #1e2947;
      color: var(--text);
      border: 1px solid var(--panel-border);
    }
    .btn-secondary:hover:not(:disabled) { background: #27355b; }
    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.25); }

    .error-msg {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .status-box {
      background: #0d1326;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 5px 0;
    }
    .status-row span:first-child { color: var(--muted); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-running { background: rgba(34, 197, 94, 0.16); color: #86efac; }
    .badge-stopped { background: rgba(148, 163, 184, 0.16); color: #cbd5e1; }
    .badge-starting { background: rgba(245, 158, 11, 0.16); color: #fcd34d; }

    .actions-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .actions-row button { flex: 1; }

    /* Loading overlay */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(79, 124, 255, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fullscreen desktop workspace view */
    .desktop-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .topbar {
      height: 44px;
      background: #0e1529;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar button {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 7px;
    }
    .desktop-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <!-- Login View -->
  <div id="view-login" class="center-wrap hidden">
    <div class="card">
      <div class="brand">
        <div class="brand-dot"></div>
        <h1>Super-Agent 云桌面</h1>
      </div>
      <p class="subtitle">浏览器直连海外 Ubuntu 工作区，内置 Claude Code、Codex、Chrome 与中文输入法。</p>
      <div id="login-error" class="error-msg hidden"></div>
      <form id="login-form">
        <label for="username">账号</label>
        <input id="username" type="text" autocomplete="username" placeholder="例如 admin" required />
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
        <button id="login-btn" type="submit" class="btn-primary">登录工作区</button>
      </form>
    </div>
  </div>

  <!-- Dashboard / Wake View -->
  <div id="view-dashboard" class="center-wrap hidden">
    <div class="card">
      <div class="brand">
        <div class="brand-dot"></div>
        <h1>工作区控制台</h1>
      </div>
      <p class="subtitle">当前用户：<strong id="dash-user"></strong></p>

      <div id="dash-error" class="error-msg hidden"></div>

      <div id="waking-panel" class="status-box hidden" style="text-align:center; padding: 28px 16px;">
        <div class="spinner"></div>
        <div style="font-weight:500; margin-bottom:6px;">正在唤醒云端工作区...</div>
        <div style="font-size:12px; color:var(--muted);">首次启动容器约需 10–25 秒，就绪后将自动进入桌面</div>
      </div>

      <div id="status-panel" class="status-box">
        <div class="status-row">
          <span>桌面状态</span>
          <span id="status-badge" class="badge badge-stopped">检查中</span>
        </div>
        <div class="status-row">
          <span>容器实例</span>
          <span id="status-container">-</span>
        </div>
        <div class="status-row">
          <span>配额规格</span>
          <span id="status-spec">-</span>
        </div>
        <div class="status-row">
          <span>同步设备锁</span>
          <span id="status-sync-lock">未连接</span>
        </div>
      </div>

      <button id="btn-launch" class="btn-primary">启动并进入云桌面</button>
      <div class="actions-row">
        <button id="btn-stop" class="btn-danger">停止容器</button>
        <button id="btn-logout" class="btn-secondary">退出登录</button>
      </div>

      <!-- Bind Local Machine (6-char Pairing Code) -->
      <div class="status-box" style="margin-top:18px; margin-bottom:0;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <strong style="font-size:13px;">本机伴侣绑定（Mac / Windows）</strong>
          <button id="btn-gen-code" class="btn-secondary" style="padding:5px 10px;font-size:12px;">生成 6 位配对码</button>
        </div>
        <div id="pair-box" class="hidden" style="background:#080d1a;border:1px dashed var(--accent);border-radius:10px;padding:12px;text-align:center;margin-bottom:10px;">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">在本机 Super-Agent 托盘应用中输入或粘贴（5 分钟内有效）</div>
          <div id="pair-code-display" style="font-size:26px;font-weight:700;letter-spacing:4px;color:#93c5fd;margin:6px 0;">---</div>
          <button id="btn-copy-bind" class="btn-primary" style="width:auto;padding:6px 14px;font-size:12px;margin-top:4px;">一键复制绑定口令（含网关地址）</button>
          <div id="pair-copy-hint" style="font-size:11px;color:#86efac;margin-top:6px;min-height:14px;"></div>
        </div>
        <div id="bound-devices-list" style="font-size:12px;color:var(--muted);">暂无已绑定设备</div>
      </div>
    </div>
  </div>

  <!-- Fullscreen Selkies Desktop View with Live Super-Agent Status HUD -->
  <div id="view-desktop" class="desktop-shell hidden">
    <div class="topbar">
      <div class="topbar-left">
        <span class="brand-dot" style="width:9px;height:9px;"></span>
        <strong>Super-Agent</strong>
        <span style="color:var(--muted);" id="bar-user"></span>
        <span id="hud-worker-badge" class="badge badge-stopped" style="font-size:11px;">本机检测中...</span>
        <span id="hud-tunnel-badge" class="badge badge-stopped" style="font-size:11px;">端口预览: 离线</span>
      </div>
      <div class="topbar-right">
        <input id="hud-preview-port" type="text" placeholder="本地端口(如3000)" style="width:128px;margin:0;padding:4px 8px;font-size:12px;border-radius:7px;" />
        <button id="bar-preview" class="btn-secondary">预览本机服务</button>
        <button id="bar-newtab" class="btn-secondary">新标签页全屏</button>
        <button id="bar-back" class="btn-secondary">返回控制台</button>
        <button id="bar-stop" class="btn-danger">停止释放</button>
      </div>
    </div>
    <iframe id="desktop-iframe" class="desktop-frame" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let currentUser = null;

    function showView(name) {
      $("view-login").classList.toggle("hidden", name !== "login");
      $("view-dashboard").classList.toggle("hidden", name !== "dashboard");
      $("view-desktop").classList.toggle("hidden", name !== "desktop");
    }

    function showError(elId, msg) {
      const el = $(elId);
      if (!msg) {
        el.classList.add("hidden");
        el.textContent = "";
      } else {
        el.textContent = msg;
        el.classList.remove("hidden");
      }
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || `请求失败 (${res.status})`);
        err.status = res.status;
        throw err;
      }
      return data;
    }

    async function init() {
      try {
        const me = await api("/api/me");
        currentUser = me.username;
        $("dash-user").textContent = currentUser;
        $("bar-user").textContent = `(${currentUser})`;
        showView("dashboard");
        await refreshStatus();
      } catch {
        showView("login");
      }
    }

    async function refreshStatus() {
      showError("dash-error", "");
      try {
        const st = await api("/api/desktop/status");
        $("status-container").textContent = st.container_name;
        $("status-spec").textContent = `${st.cpus} vCPU / ${Math.round(st.memory_mb / 1024 * 10) / 10} GB RAM`;

        const badge = $("status-badge");
        badge.className = "badge";
        if (st.state === "running" && st.ready) {
          badge.classList.add("badge-running");
          badge.textContent = "运行中";
          $("btn-launch").textContent = "进入云桌面";
          $("btn-stop").disabled = false;
        } else if (st.state === "running") {
          badge.classList.add("badge-starting");
          badge.textContent = "启动中";
          $("btn-launch").textContent = "等待并进入云桌面";
          $("btn-stop").disabled = false;
        } else if (st.state === "paused") {
          badge.classList.add("badge-starting");
          badge.textContent = "已挂起";
          $("btn-launch").textContent = "唤醒并进入云桌面";
          $("btn-stop").disabled = false;
        } else {
          badge.classList.add("badge-stopped");
          badge.textContent = st.state === "not_created" ? "未创建" : "已休眠";
          $("btn-launch").textContent = "启动并进入云桌面";
          $("btn-stop").disabled = true;
        }

        const lockInfo = await api("/api/sync/lock").catch(() => null);
        if (lockInfo && lockInfo.locked && lockInfo.lock) {
          const l = lockInfo.lock;
          $("status-sync-lock").textContent = `${l.device_name || l.device_id} (${l.os || "unknown"})`;
        } else {
          $("status-sync-lock").textContent = "未连接（可绑定）";
        }
        await refreshDevices();
      } catch (e) {
        showError("dash-error", e.message);
      }
    }

    let lastBindString = "";

    async function refreshDevices() {
      const box = $("bound-devices-list");
      try {
        const res = await api("/api/devices");
        const list = res.devices || [];
        const activeID = res.active_lock ? res.active_lock.device_id : "";
        if (list.length === 0) {
          box.innerHTML = `<span style="color:var(--muted);">暂无已绑定设备，点击右上角生成配对码即可绑定本机。</span>`;
          return;
        }
        box.innerHTML = list.map((d) => {
          const isActive = d.device_id === activeID;
          const badge = isActive ? `<span style="color:#86efac;margin-left:6px;">● 同步中</span>` : "";
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,0.06);">
            <div><strong style="color:var(--text);">${escapeHTML(d.device_name || d.device_id)}</strong> <span style="color:var(--muted);">(${escapeHTML(d.os || "-")})</span>${badge}</div>
            <button data-revoke="${escapeHTML(d.device_id)}" class="btn-danger" style="padding:3px 9px;font-size:11px;">解绑</button>
          </div>`;
        }).join("");
        box.querySelectorAll("[data-revoke]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-revoke");
            await api("/api/devices?device_id=" + encodeURIComponent(id), { method: "DELETE" });
            await refreshStatus();
          });
        });
      } catch {
        box.textContent = "无法加载已绑定设备列表";
      }
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }

    $("btn-gen-code").addEventListener("click", async () => {
      try {
        const data = await api("/api/devices/pair/create", { method: "POST" });
        lastBindString = data.bind_string || data.code;
        $("pair-code-display").textContent = data.code;
        $("pair-copy-hint").textContent = "";
        $("pair-box").classList.remove("hidden");
      } catch (err) {
        showError("dash-error", "生成配对码失败：" + err.message);
      }
    });

    $("btn-copy-bind").addEventListener("click", async () => {
      if (!lastBindString) return;
      try {
        await navigator.clipboard.writeText(lastBindString);
        $("pair-copy-hint").textContent = "已复制！去本机 Super-Agent 托盘应用直接粘贴即可完成绑定";
      } catch {
        prompt("请手动复制下方绑定口令：", lastBindString);
      }
    });

    let hudTimer = null;

    async function refreshDesktopHUD() {
      if ($("view-desktop").classList.contains("hidden")) return;
      try {
        const [execSt, tunSt] = await Promise.all([
          api("/api/exec/status").catch(() => null),
          api("/api/tunnel/status").catch(() => null),
        ]);
        const wb = $("hud-worker-badge");
        if (execSt && execSt.worker_online) {
          const dev = execSt.active_lock ? (execSt.active_lock.device_name || execSt.active_lock.device_id) : "本机";
          wb.className = "badge badge-running";
          wb.textContent = `● 本机算力在线 (${dev})`;
        } else {
          wb.className = "badge badge-starting";
          wb.textContent = "● 本机离线（云端小批量降级）";
        }
        const tb = $("hud-tunnel-badge");
        if (tunSt && tunSt.tunnel_online) {
          tb.className = "badge badge-running";
          tb.textContent = "预览通道: 就绪";
        } else {
          tb.className = "badge badge-stopped";
          tb.textContent = "预览通道: 离线";
        }
      } catch {}
    }

    function openDesktop(url) {
      $("desktop-iframe").src = url || "/desktop/";
      showView("desktop");
      refreshDesktopHUD();
      if (hudTimer) clearInterval(hudTimer);
      hudTimer = setInterval(refreshDesktopHUD, 4000);
    }

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      showError("login-error", "");
      $("login-btn").disabled = true;
      try {
        const data = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({
            username: $("username").value.trim(),
            password: $("password").value,
          }),
        });
        currentUser = data.username;
        $("dash-user").textContent = currentUser;
        $("bar-user").textContent = `(${currentUser})`;
        showView("dashboard");
        await refreshStatus();
      } catch (err) {
        showError("login-error", err.message);
      } finally {
        $("login-btn").disabled = false;
      }
    });

    $("btn-launch").addEventListener("click", async () => {
      showError("dash-error", "");
      $("btn-launch").disabled = true;
      $("btn-stop").disabled = true;
      $("status-panel").classList.add("hidden");
      $("waking-panel").classList.remove("hidden");
      try {
        const st = await api("/api/desktop/start", { method: "POST" });
        openDesktop(st.desktop_url);
      } catch (err) {
        showError("dash-error", "唤醒失败：" + err.message);
        await refreshStatus();
      } finally {
        $("waking-panel").classList.add("hidden");
        $("status-panel").classList.remove("hidden");
        $("btn-launch").disabled = false;
      }
    });

    async function stopDesktop() {
      showError("dash-error", "");
      $("btn-stop").disabled = true;
      try {
        await api("/api/desktop/stop", { method: "POST" });
        $("desktop-iframe").src = "about:blank";
        showView("dashboard");
        await refreshStatus();
      } catch (err) {
        showView("dashboard");
        showError("dash-error", "停止失败：" + err.message);
      }
    }

    $("btn-stop").addEventListener("click", stopDesktop);
    $("bar-stop").addEventListener("click", stopDesktop);

    $("bar-back").addEventListener("click", async () => {
      $("desktop-iframe").src = "about:blank";
      showView("dashboard");
      await refreshStatus();
    });

    $("bar-preview").addEventListener("click", () => {
      const raw = ($("hud-preview-port").value || "").trim();
      const port = parseInt(raw, 10);
      if (!port || port < 1 || port > 65535) {
        alert("请输入本机运行中的开发服务端口号（例如 3000 或 8080）");
        return;
      }
      window.open(`/api/tunnel/proxy/${port}/`, "_blank");
    });

    $("bar-newtab").addEventListener("click", () => {
      window.open("/desktop/", "_blank");
    });

    $("btn-logout").addEventListener("click", async () => {
      await api("/api/logout", { method: "POST" }).catch(() => {});
      currentUser = null;
      $("desktop-iframe").src = "about:blank";
      showView("login");
    });

    init();
  </script>
</body>
</html>
